name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # The postinstall would fetch chromium, firefox and webkit. Only chromium
          # is used, and it is installed explicitly in the next step.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # tests/unit/parser-session.test.ts and tests/integration/parser-mcp.integration.test.ts
      # both drive mcp/parser-session.ts, which calls chromium.launch(). --with-deps
      # pulls the system libraries the runner image does not ship.
      - name: Install chromium
        run: npx playwright install --with-deps chromium

      # tsc (both configs) + ast-grep scan
      - name: Lint
        run: npm run lint

      # unit + integration + mcp:parser + competitor-intel.
      # scripts/run-tests.sh supplies a hermetic env; no .env exists in CI.
      - name: Test
        run: npm test

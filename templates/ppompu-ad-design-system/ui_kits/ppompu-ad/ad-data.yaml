            badge: 추천
            duration: 4개월 이용권
            price: 60,000원
            priceDesc: (월 평균 10,000원)
            style: best
    notices:
      - type: box
        title: 🎈 Adobe Creative Cloud 상세 안내
        content: >-
          • 본인 계정으로 직접 활성화하는 정식 개인 구독 방식입니다.

          • 데스크탑, iOS, Android 등 전 기기를 완벽 지원하며 Photoshop, Illustrator, Premiere
          등 Creative Cloud 전체 제품 라인업 이용이 가능합니다.

          • 이용 중 문제 발생 시 복구 또는 환불해 드립니다. 상시 연장 역시 가능합니다.
  - id: section-lovable
    title: Lovable (AI 풀스택 웹앱 빌더)
    subsections:
      - cards:
          - title: 👥 라이트 플랜 (12개월)
            badge: 63% 절감
            originalPrice: 공식 정가 80,000원
            price: 품절
            priceDesc: (월 평균 2,500원)
            style: pro
          - title: ⚡ 프로 플랜 (12개월)
            badge: 58% 절감
            originalPrice: 공식 정가 380,094원
            price: 140,000원
            priceDesc: (월 평균 11,667원)
            style: pro
    notices:
      - type: box
        title: 👥 라이트 플랜 상세 안내
        content: >-
          • 본인 계정으로 직접 업그레이드하는 정식 개인 구독 방식입니다. (별도 설치 불필요)

          • 제공 혜택: 일일 5 크레딧 제공 (월 최대 150 크레딧), 사용자 역할/권한 설정, 커스텀 도메인 연결, Lovable
          배지 제거 포함.

          💡 AI가 코드를 생성하는 최첨단 풀스택 웹앱 빌더 플랫폼!
      - type: box
        title: ⚡ 프로 플랜 상세 안내
        content: |-
          • 제한 없는 풀스택 웹앱 개발 및 무제한 비공개 프로젝트 + 커스텀 도메인 설정 기능 제공.
          • 제공 혜택: 라이트 플랜 대비 월 100 크레딧 추가 제공 (일일 5 크레딧 + 매월 100 프로 크레딧).
          🛡️ AS 안내: 이용 중 문제 발생 시 복구 또는 잔여 기간 환불 해드립니다.
  - id: section-notion
    title: Notion (Business)
    subsections:
      - cards:
          - title: 📓 Notion Plus (12 개월)
            duration: 3개월 이용권
            price: 품절
            priceDesc: (월 평균 5,000원)
            style: normal
          - title: 👑 Notion Business (12개월)
            badge: 추천
            duration: 12개월 이용권
            price: 50,000원
            priceDesc: (월 평균 5,000원)
            style: pro
    notices:
      - type: box
        title: 🏢 비즈니스(Business) 플랜 상세 안내
        content: >-
          • 플러스(Plus) 기능 전면 포함: 무제한 블록 및 파일 업로드, 외부 게스트 초대 기능.

          • 비즈니스 전용 기능: SAML SSO (싱글 사인온), 고급 분석/권한 제어, 90일 페이지 기록 보관 (Plus는
          30일).

          • 비공개 팀 스페이스: 부서/프로젝트별 열람 권한을 철저히 분리 가능.

          🛡️ 보증 및 안내: 전 기간 품질 보증(AS) 및 잔여 기간 환불. 개인 계정에 바로 적용 가능한 공식 리딤 코드를
          발급합니다.
  - id: section-n8n
    title: n8n (Cloud Starter)
    subsections:
      - cards:
          - title: ⚙️ n8n Cloud Starter (12개월)
            badge: 81% 절감
            originalPrice: 공식 정가 376,000원
            price: 64,900원
            priceDesc: (월 평균 5,408원)
            style: pro
    notices:
      - type: box
        title: 🔗 n8n Cloud Starter 상세 안내
        content: >-
          • 본인 계정으로 직접 안전하게 활성화 및 관리하는 정식 개인 구독 방식입니다.

          • 제공 스펙: 월 최대 2,500 태스크 자동 실행, 액티브 워크플로우 5개 상시 활성화 가능, 테스트 워크플로우 무제한
          실행.

          • 다른 공동 작업이나 자동화를 위한 팀 멤버 무제한 초대 지원 (공유 워크스페이스 포함).

          🛡️ AS 안내: 이용 중 문제 발생 시 복구 또는 잔여 기간 환불 해드립니다.
  - id: section-surfshark
    title: NordVPN Basic
    subsections:
      - cards:
          - title: 🦈 개인 단독
            badge: 실속형
            duration: 3개월 이용권
            price: 15,000원
            priceDesc: (월 5,000원 상당)
            style: pro
          - title: 👑 개인 단독
            badge: 인기
            duration: 12개월 이용권
            price: 45,000원
            priceDesc: (월 3,750원 상당)
            style: best
    notices:
      - type: box
        title: ✨ NordVPN 프리미엄 주요 기능
        content: |-
          • 압도적인 속도와 연결: 전 세계 111개국 서버망(NordLynx 프로토콜) 및 최대 10대 동시 연결 지원.
          • 철저한 노로그(No-Logs) 정책으로 개인정보 보호 및 해외 OTT 우회 최적화 (넷플릭스 등 완벽 시청 가능).
          • 파격적인 요금비교: 월 4,000원으로 최고급 VPN 혜택을 누리세요! (타인 공유 없는 개인 전용 독립 계정)
  - id: section-coursera
    title: Online Courses (Coursera / Udemy)
    subsections:
      - cards:
          - title: 📚 Coursera Plus (12개월)
            badge: 93% 절감
            originalPrice: 공식 정가 601,376원
            price: 40,000원
            priceDesc: (월 평균 3,333원)
            style: pro
          - title: 🎓 Udemy 개인 (1개월)
            badge: 인기
            duration: 1개월 이용권
            price: 10,000원
            priceDesc: (월 10,000원 상당)
            style: best
    notices:
      - type: box
        title: 👥 온라인 강의 (Coursera / Udemy) 상세 안내
        content: >-
          • Coursera Plus (12개월): 본인 이메일로 직접 연동 및 활성화하는 정식 개인 구독 권한 부여 방식. 글로벌
          명문 대학교 인기 코스 무제한 수강 및 글로벌 공식 수료증 발급 보장 (연 US$399 대비 연 40,000원 파격 특가).

          • Udemy 개인 (1개월): 개발, 프로그래밍, 비즈니스, 디자인 등 다양한 최신 실무 베스트셀러 강의를 자유롭게 무제한
          수강할 수 있는 정식 개인 구독 플랜 (월 10,000원).

          🛡️ AS 안내: 이용 중 문제 발생 시 복구 또는 잔여 기간 환불 해드립니다.

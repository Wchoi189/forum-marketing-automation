sections:
  - id: section-youtube
    title: YouTube Premium (Music 포함)
    subsections:
      - label: 개인 단독
        desc: 독립적인 개인 구독 방식
        cards:
          - title: 👥 개인 단독 (1개월)
            badge: 인기
            duration: 1개월 이용권
            price: 8,000원
            priceDesc: (월 평균 8,00원)
            style: normal
          - title: 👑 개인 단독 (12개월)
            badge: BEST
            duration: 12개월
            price: 70,000원
            priceDesc: (월 평균 5,833원)
            style: best
      - label: 가족 플랜
        desc: YouTube 가족 초대 방식 (가성비 추천)
        cards:
          - title: 👥 가족 플랜 (6개월)
            badge: 추천
            duration: 6개월 가족 초대
            price: 품절
            priceDesc: (월 평균 4,666원)
            style: normal
          - title: 👑 가족 플랜 (12개월)
            badge: BEST
            duration: 12개월 가족 초대
            price: 품절
            priceDesc: (월 평균 4,583원)
            style: best
    notices:
      - type: details
        title: ⚠️ YouTube 이용 조건 (필독)
        content: |-
          • 신규 구글 계정 또는 기존 멤버십 가입 이력이 전혀 없는 계정 만 가능합니다.
          • 참고: 기존 음악 플레이 리스트는 새로운 계정으로 이동 가능하며 문의하시면 안내해 드리겠습니다.
      - type: details
        title: 🚨 YouTube 가입 전 필수 안내 (필독)
        content: >-
          📢  구독 해지 예방 권장 체크리스트 

          1️⃣  가족 그룹 탈퇴 (가입된 경우만 - 개인/가족 모두 해당)
          https://myaccount.google.com/family/details?pli=1 

          2️⃣  결제 프로필 삭제 (페이지 맨 아래 '결제 프로필 삭제' 클릭)
          https://payments.google.com/gp/w/u/0/home/settings 

          💡  계정 선택 팁: 1. 12개월 장기 구독 시, 안정적인 이용을 위해 프리미엄 전용 신규 계정 사용을 권장합니다.2.
          사용 이력이 많은 기존 계정을 이용할 경우 구독 안정성이 크게 떨어질 수 있으며, 이는 가격 인상의 원인이 되기도 합니다.
          3. 구글 정책상 한 번 해지된 계정으로 재가입하면 다시 해지될 가능성이 매우 높으므로 권장하지 않습니다.
      - type: box
        title: ℹ️ 개인 구독 vs 가족 초대 비교
        content: |-
          • 개인 구독: 그룹 변경 제한 걱정 없이 상시 연장이 가능합니다.
          • 가족 초대 : 계정 프로필 설정이 복잡하면 가입할 때 오류가 발생할 수 있습니다. (그룹 변경 제한, 동일 국가, 등).
  - id: google-ai
    title: 구글 AI 프로
    subsections:
      - cards:
          - title: 👥 패밀리 구성원 (12개월)
            badge: AS 보장
            duration: 12개월 이용권
            price: 20,000원
            priceDesc: (월 평균 1,667원)
            style: pro
          - title: 👑 패밀리 매니저 (18개월)
            badge: 복구 x +2번
            duration: 18개월 이용권
            price: 30,000원
            priceDesc: (월 평균 1,667원)
            style: pro
    notices:
      - type: box
        title: ✨ 구글 AI Pro 플랜별 상세 안내
        content: >-
          • 패밀리 구성원 (12개월): 본인 계정에 활성화되는 정식 구독 방식. 크레딧 공유 방식이나 일반 채팅 시 쾌적합니다. (전
          기간 품질 보증)

          • 패밀리 매니저 (18개월): 최대 5인까지 패밀리원을 직접 초9대/관리할 수 있는 마스터 권한.

          🛡️ AS 안내: 최소 1회 복구 제공 + 가족 구성원 백업 플랜. (복구 시 새로운 계정 필수)

          💡 안전한 계정 선택 팁: AI Pro 혜택 전용으로 신규 계정을 생성하시거나, 전혀 사용하지 않는 보조 계정으로 가입하시는
          것을 권장합니다.
  - id: picsart
    title: Canva Pro
    subsections:
      - cards:
          - title: 🎨 Canva Pro Edu (12개월)
            badge: 88% 절감
            originalPrice: 공식 정가 169,000원
            price: 19,800원
            priceDesc: (월 평균 1,650원)
            style: pro
    notices:
      - type: box
        title: 🎨 Canva Pro Edu 상세 안내
        content: >-
          • 본인 계정으로 직접 활성화하는 구독 방식입니다. (비밀번호나 인증코드 노출 불필요)

          • Edu Pro 기능 대부분 지원 (무제한 템플릿 다운로드, AI 디자인 도구 활용, 로고 제거 및 투명 배경 저장 등) +
          PC/모바일 전 기기 지원.

          🛡️ AS 안내: 이용 중 문제 발생 시 복구 또는 잔여 기간 환불 해드립니다.
  - id: section-adobe

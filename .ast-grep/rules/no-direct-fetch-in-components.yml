# Prevent fetch() calls inside React component files outside of hooks/.
# After the App.tsx decomposition, all data fetching lives in useAppData.
# This prevents accidental regressions back to inline fetch.
id: no-direct-fetch-in-components
severity: error
language: Tsx
rule:
  pattern: fetch($$$)
files:
  - src/**/*.tsx
ignores:
  - src/hooks/**
  - src/AnalyticsPage.tsx
  # Pre-existing debt: 5 inline fetches. Extracting them into a hook is tracked as
  # Phase E in .planning/audit/structure-roadmap-2026-08-08.md. Listed here rather
  # than downgrading the rule's severity, so the rule still fails for every new file.
  - src/pages/KakaoDashboard.tsx
